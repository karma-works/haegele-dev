<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior Developer Portfolio</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .poster-container {
            width: 720px;
            min-height: 1200px;
            margin: 0 auto;
            background: linear-gradient(180deg, #0a0a0a 0%, #1a1a1a 100%);
            position: relative;
            overflow: hidden;
        }

        /* Background decoration */
        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        /* Navigation */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 40px;
            position: relative;
            z-index: 10;
        }

        .logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ff4081;
        }

        .nav-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50px;
            padding: 8px 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-links a {
            color: #b0b0b0;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .nav-links a.active {
            color: #ff4081;
        }

        /* Hero Section */
        .hero {
            padding: 60px 40px 50px;
            position: relative;
            z-index: 10;
        }

        .dialogue-container {
            max-width: 600px;
        }

        .dialogue-line {
            font-family: 'JetBrains Mono', monospace;
            font-size: 28px;
            font-weight: 500;
            line-height: 1.6;
            margin-bottom: 16px;
            color: #e0e0e0;
            opacity: 0;
            animation: fadeInUp 0.6s ease forwards;
        }

        .dialogue-line:nth-child(1) {
            animation-delay: 0.2s;
        }

        .dialogue-line:nth-child(2) {
            animation-delay: 0.4s;
            color: #ff4081;
        }

        .dialogue-line:nth-child(3) {
            animation-delay: 0.6s;
            color: #00bcd4;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .prompt-symbol {
            color: #ff4081;
            margin-right: 8px;
        }

        /* Content Boxes */
        .content-section {
            display: flex;
            gap: 20px;
            padding: 0 40px 40px;
            position: relative;
            z-index: 10;
        }

        .content-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .content-box:hover {
            transform: translateY(-4px);
        }

        .content-box.pink {
            border-color: rgba(255, 64, 129, 0.3);
        }

        .content-box.pink:hover {
            box-shadow: 0 8px 32px rgba(255, 64, 129, 0.2);
        }

        .content-box.cyan {
            border-color: rgba(0, 188, 212, 0.3);
        }

        .content-box.cyan:hover {
            box-shadow: 0 8px 32px rgba(0, 188, 212, 0.2);
        }

        .box-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 6px;
            color: #808080;
        }

        .box-subtitle {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            font-family: 'JetBrains Mono', monospace;
        }

        .pink .box-subtitle {
            color: #ff4081;
        }

        .cyan .box-subtitle {
            color: #00bcd4;
        }

        .map-container {
            width: 100%;
            height: 220px;
            border-radius: 12px;
            overflow: hidden;
            background: #0d0d0d;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .map-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.7) contrast(1.2);
        }

        /* Language Levels */
        .language-item {
            margin-bottom: 18px;
        }

        .language-item:last-child {
            margin-bottom: 0;
        }

        .language-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .language-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #e0e0e0;
        }

        .language-percent {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            color: #00bcd4;
        }

        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00bcd4 0%, #00e5ff 100%);
            border-radius: 3px;
            transition: width 1s ease;
            box-shadow: 0 0 10px rgba(0, 188, 212, 0.5);
        }

        /* Bottom Section */
        .bottom-section {
            margin-top: 20px;
            position: relative;
            z-index: 10;
        }

        .waveform-bg {
            position: relative;
            width: 100%;
            height: 200px;
            overflow: hidden;
        }

        .waveform-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.4;
            filter: brightness(0.8);
        }

        .keyboard-section {
            position: relative;
            margin-top: -80px;
            padding: 0 40px 30px;
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .keyboard-container {
            width: 280px;
            height: 160px;
            border-radius: 12px;
            overflow: hidden;
            background: #0d0d0d;
            border: 2px solid rgba(255, 64, 129, 0.3);
            box-shadow: 0 8px 32px rgba(255, 64, 129, 0.3);
        }

        .keyboard-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tagline-container {
            flex: 1;
        }

        .tagline {
            font-size: 20px;
            font-weight: 600;
            line-height: 1.5;
            color: #e0e0e0;
            font-style: italic;
        }

        .tagline-highlight {
            color: #ff4081;
            font-weight: 700;
        }

        /* Decorative elements */
        .glow-dot {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.3;
            pointer-events: none;
        }

        .glow-dot.pink {
            width: 200px;
            height: 200px;
            background: #ff4081;
            top: 100px;
            right: -50px;
        }

        .glow-dot.cyan {
            width: 150px;
            height: 150px;
            background: #00bcd4;
            bottom: 300px;
            left: -30px;
        }

        /* Footer */
        .footer {
            padding: 20px 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .footer-text {
            font-size: 12px;
            color: #606060;
        }

        .social-icons {
            display: flex;
            gap: 16px;
        }

        .social-icons a {
            color: #808080;
            transition: color 0.3s ease;
        }

        .social-icons a:hover {
            color: #00bcd4;
        }

        .material-icons {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="poster-container">
        <div class="bg-grid"></div>
        <div class="glow-dot pink"></div>
        <div class="glow-dot cyan"></div>
        
        <!-- Navigation -->
        <nav class="navbar">
            <div class="logo">SENIOR DEV</div>
            <div class="nav-container">
                <div class="nav-links">
                    <a href="#" class="active">HOME</a>
                    <a href="#">PROJECTS</a>
                    <a href="#">ABOUT</a>
                    <a href="#">CONTACT</a>
                </div>
            </div>
        </nav>

        <!-- Hero Section -->
        <section class="hero">
            <div class="dialogue-container">
                <div class="dialogue-line">
                    <span class="prompt-symbol">&gt;</span>Hello, I'm <span style="color: #ffffff;">Alex Chen</span>.
                </div>
                <div class="dialogue-line">
                    <span class="prompt-symbol">&gt;</span>Senior Developer.
                </div>
                <div class="dialogue-line">
                    <span class="prompt-symbol">&gt;</span>Passionate Creator.
                </div>
            </div>
        </section>

        <!-- Content Section -->
        <section class="content-section">
            <!-- Performance Metrics Box -->
            <div class="content-box pink">
                <div class="box-title">PERFORMANCE METRICS</div>
                <div class="box-subtitle">STRAVA STATS</div>
                <div class="map-container">
                    <img src="https://sfile.chatglm.cn/images-ppt/68384fd4202b.png" alt="Activity Map">
                </div>
            </div>

            <!-- Language Levels Box -->
            <div class="content-box cyan">
                <div class="box-title">LANGUAGE LEVELS</div>
                <div class="box-subtitle">PROFICIENCY</div>
                
                <div class="language-item">
                    <div class="language-header">
                        <span class="language-name">JAVASCRIPT</span>
                        <span class="language-percent">95%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 95%;"></div>
                    </div>
                </div>

                <div class="language-item">
                    <div class="language-header">
                        <span class="language-name">DEUTSCH</span>
                        <span class="language-percent">80%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 80%;"></div>
                    </div>
                </div>

                <div class="language-item">
                    <div class="language-header">
                        <span class="language-name">ESPAÑOL</span>
                        <span class="language-percent">60%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 60%;"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Bottom Section -->
        <section class="bottom-section">
            <div class="waveform-bg">
                <img src="https://sfile.chatglm.cn/images-ppt/381aac0e8526.jpg" alt="Waveform">
            </div>
            
            <div class="keyboard-section">
                <div class="keyboard-container">
                    <img src="https://sfile.chatglm.cn/images-ppt/b835b35590c1.jpg" alt="Mechanical Keyboard">
                </div>
                <div class="tagline-container">
                    <div class="tagline">
                        <span class="tagline-highlight">Coding the world,</span><br>
                        one language at a time.
                    </div>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-text">© 2024 Alex Chen. All rights reserved.</div>
            <div class="social-icons">
                <a href="#"><i class="material-icons">code</i></a>
                <a href="#"><i class="material-icons">link</i></a>
                <a href="#"><i class="material-icons">email</i></a>
            </div>
        </footer>
    </div>
</body>
</html>
